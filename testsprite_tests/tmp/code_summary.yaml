    endpoints:
      - method: GET
        path: /Api/Group/GetAll
        description: Get all groups
        auth_required: true
        response_schema:
          "200": Group[]
      - method: POST
        path: /Api/Group/Create
        description: Create new group
        auth_required: true
        response_schema:
          "200": Group
      - method: PUT
        path: /Api/Group/Update/{id}
        description: Update group
        auth_required: true
        response_schema:
          "200": Group
      - method: DELETE
        path: /Api/Group/Delete/{id}
        description: Delete group
        auth_required: true
        response_schema:
          "200": "{success: true}"
    depends_on:
      - Batch Management

  - name: Section Management
    description: Manage course content sections
    files:
      - Zumra/Controllers/SectionController.cs
    endpoints:
      - method: GET
        path: /Api/Section/GetAll
        description: Get all sections for a course
        auth_required: true
        response_schema:
          "200": Section[]
      - method: POST
        path: /Api/Section/Create
        description: Create new section
        auth_required: true
        response_schema:
          "200": Section
      - method: PUT
        path: /Api/Section/Update/{id}
        description: Update section
        auth_required: true
        response_schema:
          "200": Section
      - method: DELETE
        path: /Api/Section/Delete/{id}
        description: Delete section
        auth_required: true
        response_schema:
          "200": "{success: true}"
    depends_on:
      - Course Management

  - name: Lesson Management
    description: Manage lessons within course sections, including recorded and live lessons
    files:
      - Zumra/Controllers/LessonController.cs
    endpoints:
      - method: GET
        path: /Api/Lesson/GetAll
        description: Get all lessons
        auth_required: true
        response_schema:
          "200": Lesson[]
      - method: POST
        path: /Api/Lesson/Create
        description: Create new lesson
        auth_required: true
        response_schema:
          "200": Lesson
      - method: PUT
        path: /Api/Lesson/Update/{id}
        description: Update lesson
        auth_required: true
        response_schema:
          "200": Lesson
      - method: DELETE
        path: /Api/Lesson/Delete/{id}
        description: Delete lesson
        auth_required: true
        response_schema:
          "200": "{success: true}"
    depends_on:
