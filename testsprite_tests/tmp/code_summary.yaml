version: "2"
type: backend
tech_stack:
  - C# / ASP.NET Core 8
  - Entity Framework Core
  - SQL Server
  - ASP.NET Core Identity
  - JWT Bearer Authentication
  - Stripe Payments
  - BunnyCDN
features:
  - name: Authentication & Account Management
    description: User registration, login, email confirmation, OTP-based password reset, and Google OAuth login
    files:
      - Zumra/Controllers/AccountController.cs
    endpoints:
      - method: POST
        path: /Auth/Account/Login
        description: Login with username/email and password, returns JWT token
        auth_required: false
        request_schema:
          body:
            UserName: string
            Password: string
            RememberMe: boolean
        response_schema:
          "200": "{success: true, token: string}"
          "400": "{success: false, message: string}"
      - method: POST
        path: /Auth/Account/Register
        description: Register a new user account and send confirmation email
        auth_required: false
        request_schema:
          body:
            Email: string
            Password: string
            Name: string
        response_schema:
          "200": "{success: true, message: string}"
          "400": "{success: false, errors: []}"
      - method: GET
        path: /Auth/Account/Confirm
        description: Confirm user email via token link
        auth_required: false
        request_schema:
          query:
            token: string
            id: string
        response_schema:
          "200": "{success: true}"
          "400": "{success: false}"
      - method: POST
        path: /Auth/Account/ForgotPassword
        description: Send OTP code to email for password reset
        auth_required: false
        request_schema:
          body:
            Email: string
        response_schema:
          "200": "{success: true, message: string}"
      - method: POST
        path: /Auth/Account/VerifyOTP
        description: Verify OTP code for password reset
        auth_required: false
        request_schema:
          body:
            Email: string
            Otp: string
        response_schema:
          "200": "{success: true}"
          "400": "{success: false}"
      - method: POST
        path: /Auth/Account/ResetPassword
        description: Reset user password after OTP verification
        auth_required: false
        request_schema:
          body:
            Email: string
            Password: string
        response_schema:
          "200": "{success: true}"
          "400": "{success: false}"
      - method: GET
        path: /Auth/Account/ExternalLogin
        description: Initiate Google OAuth login
        auth_required: false
        request_schema:
          query:
            provider: string
            returnUrl: string
        response_schema:
          "302": Challenge redirect
      - method: GET
        path: /Auth/Account/ExternalLoginCallback
        description: Google OAuth callback, creates user if needed, returns JWT token
        auth_required: false
        response_schema:
          "200": "{success: true, token: string, email: string, username: string}"

  - name: Facility Management
    description: CRUD operations for facilities (academies/centers), with Stripe payment for activation
    files:
      - Zumra/Controllers/FacilityController.cs
    endpoints:
      - method: GET
        path: /Api/Facility/GetAll
        description: Get all facilities
        auth_required: false
        response_schema:
          "200": "{success: true, data: Facility[]}"
      - method: GET
        path: /Api/Facility/GetById/{id}
        description: Get a single facility by ID
        auth_required: false
        response_schema:
          "200": "{success: true, data: Facility}"
          "404": "{success: false}"
      - method: POST
        path: /Api/Facility/Create
        description: Create a new facility (form-data with optional image)
        auth_required: true
        request_schema:
          form:
            Name: string
            Description: string
            Type: string
            CategoryId: integer
            Image: file (optional)
        response_schema:
          "201": "{success: true, data: {id, name, category}}"
          "400": "{success: false}"
      - method: PUT
        path: /Api/Facility/Update/{id}
        description: Update a facility (SuperAdmin only)
        auth_required: true
        response_schema:
          "200": "{success: true}"
          "403": Forbidden
          "404": "{success: false}"
      - method: DELETE
        path: /Api/Facility/Delete
        description: Delete a facility (SuperAdmin only)
        auth_required: true
        response_schema:
          "200": "{success: true}"
          "403": Forbidden
      - method: POST
        path: /Api/Facility/Pay
        description: Create Stripe checkout session to activate facility
        auth_required: true
        response_schema:
          "200": "{CheckoutUrl: string}"
      - method: GET
        path: /Api/Facility/Success
        description: Stripe payment success callback - activates facility
        auth_required: false
        response_schema:
          "200": "{success: true}"
      - method: GET
        path: /Api/Facility/Cancel
        description: Stripe payment cancel callback
        auth_required: false
        response_schema:
          "200": "{success: false}"
    depends_on:
      - Authentication & Account Management

  - name: Category Management
    description: CRUD operations for course categories
    files:
      - Zumra/Controllers/CategoryController.cs
    endpoints:
      - method: GET
        path: /Api/Category/GetAll
        description: Get all categories
        auth_required: false
        response_schema:
          "200": Category[]
      - method: POST
        path: /Api/Category/Create
        description: Create new category
        auth_required: true
        response_schema:
          "200": Category
      - method: PUT
        path: /Api/Category/Update/{id}
        description: Update category
        auth_required: true
        response_schema:
          "200": Category
      - method: DELETE
        path: /Api/Category/Delete/{id}
        description: Delete category
        auth_required: true
        response_schema:
          "200": "{success: true}"
    depends_on:
      - Authentication & Account Management

  - name: Course Management
    description: CRUD operations for courses within a facility
    files:
      - Zumra/Controllers/CourseController.cs
    endpoints:
      - method: GET
        path: /Api/Course/GetAll
        description: Get all courses
        auth_required: false
        response_schema:
          "200": Course[]
      - method: GET
        path: /Api/Course/GetById/{id}
        description: Get course by ID
        auth_required: false
        response_schema:
          "200": Course
      - method: POST
        path: /Api/Course/Create
        description: Create new course
        auth_required: true
        response_schema:
          "200": Course
      - method: PUT
        path: /Api/Course/Update/{id}
        description: Update course
        auth_required: true
        response_schema:
          "200": Course
      - method: DELETE
        path: /Api/Course/Delete/{id}
        description: Delete course
        auth_required: true
        response_schema:
          "200": "{success: true}"
    depends_on:
      - Facility Management
      - Category Management

  - name: Batch Management
    description: Manage course batches (groups of students per course)
    files:
