known_limitations:
  - issue: Email confirmation required before login (ASPNET Identity setting)
    location: Zumra/Program.cs
    impact: Tests that attempt to login with newly registered users will fail unless email is confirmed
  - issue: Stripe payment integration requires live keys for facility activation
    location: Zumra/Controllers/FacilityController.cs
    impact: Pay/Success endpoints require valid Stripe configuration
  - issue: Google OAuth requires external configuration
    location: Zumra/Controllers/AccountController.cs
    impact: ExternalLogin/ExternalLoginCallback endpoints require Google credentials
  - issue: JWT auth required for most write operations
    location: Multiple controllers
    impact: Tests for create/update/delete endpoints need a valid JWT token
