        description: Get all batches for a course
        auth_required: true
        response_schema:
          "200": Batch[]
      - method: POST
        path: /Api/Batch/Create
        description: Create a new batch
        auth_required: true
        response_schema:
          "200": Batch
      - method: PUT
        path: /Api/Batch/Update/{id}
        description: Update a batch
        auth_required: true
        response_schema:
          "200": Batch
      - method: DELETE
        path: /Api/Batch/Delete/{id}
        description: Delete a batch
        auth_required: true
        response_schema:
          "200": "{success: true}"
    depends_on:
      - Course Management

  - name: Group Management
    description: Manage student groups within batches
    files:
