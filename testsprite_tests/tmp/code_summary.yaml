  - name: Task Management
    description: Manage assignments/tasks within course sections
    files:
      - Zumra/Controllers/TaskController.cs
    endpoints:
      - method: GET
        path: /Api/Task/GetAll
        description: Get all tasks
        auth_required: true
        response_schema:
